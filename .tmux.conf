# =========================================
# smart-splits.nvim integration
# =========================================
# Let smart-splits detect focus changes correctly.
set -g focus-events on

# Use Ctrl-w followed by h/j/k/l to move between tmux panes.
# In Neovim, forward Ctrl-w so smart-splits handles internal windows first.
bind-key -n C-w if -F "#{@pane-is-vim}" "send-keys C-w" "switch-client -T ctrl-w"

bind-key -T ctrl-w h select-pane -L
bind-key -T ctrl-w j select-pane -D
bind-key -T ctrl-w k select-pane -U
bind-key -T ctrl-w l select-pane -R

# Resize with Alt-h/j/k/l.
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# Keep Ctrl-w navigation available while tmux copy mode is active.
bind-key -T copy-mode-vi C-w switch-client -T ctrl-w

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vim copy
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# mouse
set -g mouse on

# copy-board paste
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
set -g set-clipboard on

# same directory split
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# resize pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
