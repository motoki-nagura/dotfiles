# Reduce terminal key-sequence latency inside tmux.
set -s escape-time 10

# Explicitly pass Ctrl-w through to applications such as Neovim.
# The following h/j/k/l key is then handled by Neovim's native window command.
bind-key -n C-w send-keys C-w

# Move between tmux panes with the normal prefix (Ctrl-b), then h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vim copy
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# mouse
set -g mouse on

# copy-board paste
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
set -g set-clipboard on

# same directory split
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# resize pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
